<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Rights — your Australian Consumer Law claim helper</title>
<meta name="description" content="Keep your receipts, and when something breaks, find out your rights under the Australian Consumer Law and get a claim letter ready to send.">
<meta name="theme-color" content="#2f855a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --brand: #2f855a; --brand-dark: #276749; --ink: #1a202c; --muted: #5a6474; --line: #e2e8f0; --bg: #f7faf8; --warn: #b7791f; --bad: #c53030; --good: #2f855a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 1.15rem; margin: 0; flex: 1; cursor: pointer; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 1.3rem; margin: 8px 0 12px; }
  h3 { font-size: 1.05rem; margin: 20px 0 8px; }
  button, .btn { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  button.primary:hover { background: var(--brand-dark); }
  button.danger { color: var(--bad); border-color: #feb2b2; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .item { cursor: pointer; display: flex; gap: 12px; align-items: center; }
  .item:hover { border-color: var(--brand); }
  .item .thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--line); flex: none; }
  .item .meta { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .muted { color: var(--muted); font-size: .92rem; }
  .pill { font-size: .78rem; padding: 2px 8px; border-radius: 10px; display: inline-block; }
  .pill.ok { background: #c6f6d5; color: #22543d; }
  .pill.off { background: #feebc8; color: #7b341e; }
  .pill.none { background: var(--line); color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  label .muted { font-weight: 400; }
  input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid #cbd5e0; border-radius: 8px; background: #fff; }
  textarea { min-height: 84px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 14px 0; padding: 8px 14px 12px; }
  legend { font-weight: 600; padding: 0 6px; }
  .opt { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 8px 0; }
  .opt input { margin-top: 4px; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photos figure { margin: 0; position: relative; }
  .photos img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .photos button { position: absolute; top: 2px; right: 2px; padding: 0 6px; font-size: .8rem; }
  .verdict { border-left: 6px solid var(--muted); }
  .verdict.strong { border-left-color: var(--good); }
  .verdict.moderate { border-left-color: var(--warn); }
  .verdict.weak, .verdict.none { border-left-color: var(--bad); }
  .verdict h3 { margin-top: 0; }
  ul.tight { margin: 6px 0; padding-left: 20px; }
  pre.letter { white-space: pre-wrap; font: 15px/1.55 Georgia, "Times New Roman", serif; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin: 0; }
  .disclaimer { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: 28px; padding-top: 12px; }
  .empty { text-align: center; padding: 36px 16px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 20; }
  dialog { border: none; border-radius: 12px; padding: 0; max-width: 92vw; }
  dialog img { display: block; max-width: 92vw; max-height: 85vh; }
  .hidden { display: none !important; }
  @media print {
    header, .no-print, .disclaimer { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    pre.letter { border: none; padding: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="home-link">Receipt Rights</h1>
  <button id="settings-btn" type="button">Settings</button>
</header>
<main id="app" aria-live="polite"></main>
<dialog id="viewer"><img alt="Receipt photo"></dialog>
<script src="acl.js"></script>
<script src="reminders.js"></script>
<script src="app.js"></script>
</body>
</html>
